name: Deploy (GitHub Pages)

on:
  # House standard: nothing reaches the live site unless the checks passed. A push to main runs CI
  # (the full Playwright suite); this publishes only when that run succeeded, from the commit it
  # tested. workflow_dispatch stays for manual re-runs.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static checks (fast gate before publishing)
        run: node test/check.mjs
      - name: Embed guides + assemble the site
        run: |
          node tools/embed-guides.mjs
          mkdir -p _site
          cp gym-tracker.html _site/index.html
          cp manifest.webmanifest sw.js icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png _site/
          cp -r fonts _site/fonts
          BUILD=$(grep -oE 'build [0-9]+' gym-tracker.html | head -1 | grep -oE '[0-9]+')
          sed -i "s/__BUILD__/${BUILD:-0}/" _site/sw.js
          echo "Assembled _site for build ${BUILD:-0}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # House standards: check the live site after every deploy, then tag the release.
  after-deploy:
    needs: deploy
    uses: adervec/CoworkSyncHub/.github/workflows/after-deploy.yml@main
    with:
      url: https://adervec.github.io/GymTracker315/
    permissions:
      contents: write
